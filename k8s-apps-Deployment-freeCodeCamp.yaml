apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: freecodecamp
  name: freecodecamp
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freecodecamp
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: freecodecamp
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 0
      imagePullSecrets:
        - name: github-container-registry
      containers:
      - image: ghcr.io/esimim/freecodecamp-backenddevandapi:latest
        name: freecodecamp-backenddevandapi
        ports:
        - containerPort: 3000
        resources: {}
        volumeMounts:
        - name: tls-certs
          mountPath: "/opt/app-root/src"
          readOnly: true
      volumes: 
        - name: tls-certs
          secret:
            secretName: freecodecamp-tls-certificate
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
status: {}
