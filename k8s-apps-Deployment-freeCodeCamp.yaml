apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: freecodecamp
  name: freecodecamp
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freecodecamp
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: freecodecamp
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      imagePullSecrets:
        - name: github-container-registry
      # initContainers:
      #   - name: fix-permissions
      #     image: busybox
      #     command: ["sh", "-c", "chown -R 0:0 /certs"]
      #     volumeMounts:
      #     - name: tlscerts
      #       mountPath: /certs
      containers:
      - image: ghcr.io/esimim/freecodecamp-backenddevandapi:latest
        name: freecodecamp-backenddevandapi
        ports:
        - containerPort: 443
        resources: {}
        volumeMounts:
        - name: tlscerts
          mountPath: "/opt/app-root/src/certs"
          readOnly: true
      volumes: 
        - name: tlscerts
          secret:
            secretName: freecodecamp-tls-certificate
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
status: {}
