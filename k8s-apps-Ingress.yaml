apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appsingress
  annotations: 
    cert-manager.io/issuer: "letsencrypt-prod"
  namespace: apps
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - freecodecamp.cluster.cloudvix.com.br
    secretName: freecodecamp-tls
  rules:
  - host: freecodecamp.cluster.cloudvix.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mynginx
            port:
              number: 80