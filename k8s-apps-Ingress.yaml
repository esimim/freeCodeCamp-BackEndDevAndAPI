apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appsingress
  annotations: 
    cert-manager.io/issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  namespace: apps
spec:
  ingressClassName: nginx
  # tls:
  # - hosts:
  #   - freecodecamp.cluster.cloudvix.com.br
  #   secretName: freecodecamp-tls
  rules:
  - host: freecodecamp.cluster.cloudvix.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: freecodecamp
            port:
              number: 3000