AWSTemplateFormatVersion: '2010-09-09'
Description: 'This Stack creates a security group for Cloudvix k8s cluster allowing HTTP and HTTPS traffic.'
Metadata:
  License: Apache-2.0
  Maintainer: Cloudvix
  Version: '1.0'
Resources:
  ALBSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupName: 'ALBSecurityGroup'
      GroupDescription: 'Security group for web server allowing HTTP and HTTPS traffic'
      VpcId: 'vpc-0ff4b82bca046d430'  # Replace with your VPC ID
      SecurityGroupIngress:
        - IpProtocol: 'tcp'
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
        - IpProtocol: 'tcp'
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
      Tags:
        - Key: 'Name'
          Value: 'ALBSecurityGroup'
        - Key: 'Environment'
          Value: 'Production'
        - Key: 'Project'
          Value: 'Cloudvix'
        - Key: 'Owner'
          Value: 'Eliandro'

  AcceptFromALBAllTraffic:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      GroupId: 'sg-096df42733857db7f'
      IpProtocol: -1
      FromPort: -1
      ToPort: -1
      SourceSecurityGroupId: 'sg-0ce4e7776233a3bed'

  AcceptOnPort31324:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      Description: 'Allow HTTP traffic on port 31324 from the world.'
      GroupId: 'sg-096df42733857db7f'
      IpProtocol: tcp
      FromPort: '31324'
      ToPort: '31324'
      CidrIp: '0.0.0.0/0'

  # Open the ingress controller port to the world
  AcceptOnPort32356:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      Description: 'Allow HTTPS traffic on port 32356 from the world.'
      GroupId: 'sg-096df42733857db7f'
      IpProtocol: tcp
      FromPort: '32356'
      ToPort: '32356'
      CidrIp: '0.0.0.0/0'

Outputs:
  ALBSecurityGroupId:
    Description: 'The ID of the security group'
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupId'

# to create the stack
# aws cloudformation create-stack --stack-name CloudvixSecurityGroup --template-body file://AWS-Secutiry-Group-for-Cloudvix-cluster.yaml --profile kops-manager

# to create a change set
# aws cloudformation create-change-set --stack-name CloudvixSecurityGroup --template-body file://AWS-Secutiry-Group-for-Cloudvix-cluster.yaml --change-set-name OpenPort32709 --description 'Accept on port 32709 from the world.' --profile kops-manager

# to update the stack
# aws cloudformation update-stack --stack-name CloudvixSecurityGroup --template-body file://AWS-Secutiry-Group-for-Cloudvix-cluster.yaml --profile kops-manager


